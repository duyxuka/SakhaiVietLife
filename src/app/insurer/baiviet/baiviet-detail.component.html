<!-- baiviet-detail.component.html -->
<form [formGroup]="form" (ngSubmit)="saveChange()" skipValidation>
  <p-panel #pnl header="Chi tiết bài viết">

    <ng-template pTemplate="body">
      <div class="flex flex-col gap-6 mt-4">

        <!-- Nhóm -->
        <div>
          <label class="font-bold mb-2 block">
            Nhóm <span class="text-red-500">*</span>
          </label>
          <p-select
            formControlName="nhomId"
            [options]="nhomOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Chọn nhóm bài viết"
            fluid />
          <app-validation-message
            [entityForm]="form"
            fieldName="nhomId"
            [validationMessages]="validationMessages" />
        </div>

        <!-- Tiêu đề -->
        <div>
          <label class="font-bold mb-2 block">
            Tiêu đề <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            formControlName="tieuDe"
            placeholder="Nhập tiêu đề bài viết"
            (blur)="onTieuDeBlur()"
            fluid />
          <app-validation-message
            [entityForm]="form"
            fieldName="tieuDe"
            [validationMessages]="validationMessages" />
        </div>

        <!-- Slug -->
        <div>
          <label class="font-bold mb-2 block">
            Slug <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            formControlName="slug"
            placeholder="vd: huong-dan-chon-may-hut-sua"
            fluid />
          <app-validation-message
            [entityForm]="form"
            fieldName="slug"
            [validationMessages]="validationMessages" />
        </div>

        <!-- Mô tả ngắn -->
        <div>
          <label class="font-bold mb-2 block">Mô tả ngắn</label>
          @if (editorReady) {
            <ckeditor
              [editor]="Editor"
              [config]="configCkeditor"
              formControlName="moTaNgan"
              (ready)="onEditorReady($event)">
            </ckeditor>
          }
        </div>

        <!-- Nội dung -->
        <div>
          <label class="font-bold mb-2 block">Nội dung</label>
          @if (editorReady) {
            <ckeditor
              [editor]="Editor"
              [config]="configCkeditor"
              formControlName="noiDung"
              (ready)="onEditorReady($event)">
            </ckeditor>
          }
        </div>

        <!-- Ảnh đại diện -->
        <div>
          <label class="font-bold mb-2 block">Ảnh đại diện</label>
          <p-fileUpload
            mode="basic"
            name="file"
            accept="image/*"
            chooseLabel="Chọn ảnh"
            [auto]="false"
            [customUpload]="true"
            (onSelect)="onSelectImage($event)"
            [maxFileSize]="2097152"
            class="w-full">
          </p-fileUpload>
          @if (previewImage) {
            <img [src]="previewImage" class="mt-3 border rounded" width="200" />
          }
        </div>

        <!-- Ngày xuất bản -->
        <div>
          <label class="font-bold mb-2 block">
            Ngày xuất bản <span class="text-red-500">*</span>
          </label>
          <p-datepicker
            formControlName="xuatBanLuc"
            dateFormat="dd/mm/yy"
            showIcon="true"
            fluid />
        </div>

         <!-- SEO -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold mb-2">Title SEO</label>
            <input pInputText formControlName="seoTitle" fluid />
          </div>

          <div>
            <label class="block font-bold mb-2">Keyword</label>
            <input pInputText formControlName="seoKeywords" fluid />
          </div>
        </div>

        <div>
          <label class="block font-bold mb-2">Description SEO</label>
          <textarea
            pInputTextarea
            rows="3"
            formControlName="seoDescription"
            fluid
          ></textarea>
        </div>
        
        <!-- Hiển thị -->
        <div class="flex align-items-center gap-2">
          <p-toggleswitch formControlName="hienThi" />
          <label>Hiển thị</label>
        </div>

      </div>
    </ng-template>

    <ng-template pTemplate="footer">
      <p-toolbar>
        <ng-template pTemplate="end">
          <p-button
            label="Hủy"
            icon="pi pi-times"
            severity="secondary"
            [outlined]="true"
            [rounded]="true"
            (onClick)="cancel()"
            class="mr-2" />
          <p-button
            type="submit"
            label="Lưu lại"
            icon="pi pi-check"
            [disabled]="!form.valid || btnDisabled"
            [loading]="btnDisabled" />
        </ng-template>
      </p-toolbar>
    </ng-template>

    <p-blockui [blocked]="blockedPanel" [target]="pnl">
      <p-progress-spinner style="top: 37%;" />
    </p-blockui>

  </p-panel>
</form>
