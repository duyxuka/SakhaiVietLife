<!-- danhmuc-detail.component.html -->
<form [formGroup]="form" (ngSubmit)="saveChange()" skipValidation>
  <p-panel #pnl header="Chi tiết danh mục">

    <ng-template pTemplate="body">
      <div class="flex flex-col gap-6 mt-4">

        <!-- Tên danh mục -->
        <div>
          <label class="font-bold mb-2 block">
            Tên danh mục <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            formControlName="ten"
            placeholder="Nhập tên danh mục"
            (blur)="onTenBlur()"
            fluid />
          <app-validation-message
            [entityForm]="form"
            fieldName="ten"
            [validationMessages]="validationMessages" />
        </div>

        <!-- Slug -->
        <div>
          <label class="font-bold mb-2 block">
            Slug <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            formControlName="slug"
            placeholder="vd: may-hut-sua"
            fluid />
          <app-validation-message
            [entityForm]="form"
            fieldName="slug"
            [validationMessages]="validationMessages" />
        </div>

        <!-- Mô tả -->
        <div>
          <label class="font-bold mb-2 block">Mô tả</label>
          @if (editorReady) {
            <ckeditor
              [editor]="Editor"
              [config]="configCkeditor"
              formControlName="moTa"
              (ready)="onEditorReady($event)">
            </ckeditor>
          }
        </div>

        <!-- Thứ tự -->
        <div>
          <label class="font-bold mb-2 block">
            Thứ tự <span class="text-red-500">*</span>
          </label>
          <p-inputnumber
            formControlName="thuTu"
            [min]="0"
            [showButtons]="true"
            buttonLayout="horizontal"
            incrementButtonIcon="pi pi-plus"
            decrementButtonIcon="pi pi-minus"
            fluid />
          <app-validation-message
            [entityForm]="form"
            fieldName="thuTu"
            [validationMessages]="validationMessages" />
        </div>

        <!-- Ảnh menu -->
        <div>
          <label class="font-bold mb-2 block">Ảnh menu</label>

          <p-fileUpload
            mode="basic"
            name="file"
            accept="image/*"
            chooseLabel="Chọn ảnh"
            [auto]="false"
            [customUpload]="true"
            (onSelect)="onSelectImage($event)"
            [maxFileSize]="307200"
            class="w-full">
          </p-fileUpload>

          @if (previewImage) {
            <img
              [src]="previewImage"
              class="mt-3 border rounded"
              style="width:200px;" />
          }
        </div>

      </div>
    </ng-template>

    <ng-template pTemplate="footer">
      <p-toolbar>
        <ng-template pTemplate="end">
          <p-button
            label="Hủy"
            icon="pi pi-times"
            severity="secondary"
            [outlined]="true"
            [rounded]="true"
            (onClick)="cancel()"
            class="mr-2" />
          <p-button
            type="submit"
            label="Lưu lại"
            icon="pi pi-check"
            [disabled]="!form.valid || btnDisabled"
            [loading]="btnDisabled" />
        </ng-template>
      </p-toolbar>
    </ng-template>

    <p-blockui [blocked]="blockedPanel" [target]="pnl">
      <p-progress-spinner style="top: 37%;" />
    </p-blockui>

  </p-panel>
</form>
