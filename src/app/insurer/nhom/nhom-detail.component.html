<form [formGroup]="form" (ngSubmit)="saveChange()" skipValidation>
  <p-panel #pnl header="Chi tiết nhóm">

    <ng-template pTemplate="body">
      <div class="flex flex-col gap-6 mt-4">

        <div>
          <label class="font-bold mb-2 block">
            Danh mục <span class="text-red-500">*</span>
          </label>

          <p-select
            formControlName="danhMucId"
            [options]="danhMucs"
            optionLabel="ten"
            optionValue="id"
            placeholder="Chọn danh mục"
            [filter]="true"
            filterBy="ten"
            appendTo="body"
            class="w-full"
            styleClass="w-full">
          </p-select>

          <app-validation-message
            [entityForm]="form"
            fieldName="danhMucId"
            [validationMessages]="validationMessages" />
        </div>

        <div>
          <label class="font-bold mb-2 block">
            Tên nhóm <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            formControlName="ten"
            placeholder="Nhập tên nhóm"
            (blur)="onTenBlur()"
            fluid />
          <app-validation-message
            [entityForm]="form"
            fieldName="ten"
            [validationMessages]="validationMessages" />
        </div>

        <div>
          <label class="font-bold mb-2 block">
            Slug <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            formControlName="slug"
            placeholder="Nhập slug, ví dụ: bao-hiem-suc-khoe"
            fluid />
          <app-validation-message
            [entityForm]="form"
            fieldName="slug"
            [validationMessages]="validationMessages" />
        </div>

        <div>
          <label class="font-bold mb-2 block">Mô tả</label>
            @if (editorReady) {
            <ckeditor
              [editor]="Editor"
              [config]="configCkeditor"
              formControlName="moTa"
              (ready)="onEditorReady($event)">
            </ckeditor>
          }
        </div>

          <!-- SEO -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold mb-2">Title SEO</label>
            <input pInputText formControlName="seoTitle" fluid />
          </div>

          <div>
            <label class="block font-bold mb-2">Keyword</label>
            <input pInputText formControlName="seoKeywords" fluid />
          </div>
        </div>

        <div>
          <label class="block font-bold mb-2">Description SEO</label>
          <textarea
            pInputTextarea
            rows="3"
            formControlName="seoDescription"
            fluid
          ></textarea>
        </div>
        
        <div>
          <label class="font-bold mb-2 block">
            Thứ tự <span class="text-red-500">*</span>
          </label>
          <p-inputnumber
            formControlName="thuTu"
            [min]="0"
            placeholder="Nhập thứ tự hiển thị"
            fluid />
          <app-validation-message
            [entityForm]="form"
            fieldName="thuTu"
            [validationMessages]="validationMessages" />
        </div>

        <div>
          <label class="font-bold mb-2 block">Logo</label>

          <p-fileUpload
            mode="basic"
            name="file"
            accept="image/*"
            chooseLabel="Chọn logo"
            [auto]="false"
            [customUpload]="true"
            (onSelect)="onSelectLogo($event)"
            [maxFileSize]="307200"
            class="w-full">
          </p-fileUpload>

          @if (previewLogo) {
            <img
              [src]="previewLogo"
              alt="Logo nhóm"
              class="mt-3 border rounded"
              style="width:200px;" />
          }
        </div>

      </div>
    </ng-template>

    <ng-template pTemplate="footer">
      <p-toolbar>
        <ng-template pTemplate="end">
          <p-button
            label="Hủy"
            icon="pi pi-times"
            severity="secondary"
            [outlined]="true"
            [rounded]="true"
            (onClick)="cancel()"
            class="mr-2" />

          <p-button
            type="submit"
            label="Lưu lại"
            icon="pi pi-check"
            [disabled]="!form.valid || btnDisabled"
            [loading]="btnDisabled" />
        </ng-template>
      </p-toolbar>
    </ng-template>

    <p-blockui [blocked]="blockedPanel" [target]="pnl">
      <p-progress-spinner style="top: 37%;" />
    </p-blockui>

  </p-panel>
</form>
